<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=800, initial-scale=1">
  <title>FIXED — First run</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #090C10;
      --surface: #121820;
      --elevated: #19212B;
      --line: rgba(213,225,237,.12);
      --text: #F2F5F7;
      --muted: #9AA6B5;
      --lime: #C6FF4A;
      --size-display: 42px;
      --size-body: 14px;
      --size-meta: 11px;
      --dur-micro: 100ms;
      --dur-short: 200ms;
      --dur-med: 300ms;
      --dur-long: 500ms;
      --ease-standard: cubic-bezier(.2,0,0,1);
      --ease-decel: cubic-bezier(.05,.7,.1,1);
      --ease-accel: cubic-bezier(.3,0,.8,.15);
      --ease-pop: cubic-bezier(.2,1.6,.4,1);
      --delay-1: 0ms;
      --delay-2: 50ms;
      --delay-3: 100ms;
      --delay-4: 150ms;
      --delay-5: 200ms;
    }
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 800px; margin: 0; background: var(--bg); color: var(--text); }
    body { display: grid; place-items: center; overflow: hidden; font-size: var(--size-body); background: radial-gradient(circle at 50% 38%, rgba(198,255,74,.07), transparent 30%), var(--bg); }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    :focus { outline: 0; }
    :focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; animation: focus-in var(--dur-micro) var(--ease-standard) both; }
    .scene { display: grid; width: 100%; height: 100%; place-items: center; }
    .card { width: 520px; padding: 38px 42px 34px; border: 1px solid var(--line); border-radius: 14px; background: rgba(18,24,32,.96); box-shadow: 0 24px 70px rgba(0,0,0,.34), 0 0 0 1px rgba(198,255,74,.11); animation: fade-rise var(--dur-med) var(--ease-decel) var(--delay-1) both; }
    .brand { display: inline-block; color: var(--text); font-size: var(--size-body); font-weight: 850; letter-spacing: .22em; line-height: 1; }
    .brand .x { color: var(--lime); }
    .card h1 { margin: 27px 0 28px; font-size: var(--size-display); line-height: .98; letter-spacing: -.07em; }
    .settings { border-top: 1px solid var(--line); }
    .setting { display: flex; align-items: center; justify-content: space-between; min-height: 65px; gap: 18px; border-bottom: 1px solid var(--line); animation: fade-rise var(--dur-med) var(--ease-decel) var(--setting-delay) both; }
    .setting:nth-child(1) { --setting-delay: var(--delay-2); }.setting:nth-child(2) { --setting-delay: var(--delay-3); }.setting:nth-child(3) { --setting-delay: var(--delay-4); }
    .setting-name { font-weight: 750; }
    .setting-tools, .toggle-wrap { display: flex; align-items: center; gap: 11px; }
    .detected { padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--elevated); color: var(--muted); font-size: var(--size-meta); white-space: nowrap; }
    .change { position: relative; padding: 0; background: transparent; color: var(--muted); font-size: var(--size-meta); transition: color var(--dur-micro) var(--ease-standard); }
    .change:hover { color: var(--text); }
    .change::after { position: absolute; right: 0; bottom: -4px; left: 0; height: 1px; background: var(--lime); content: ""; transform: scaleX(0); transform-origin: left; transition: transform var(--dur-micro) var(--ease-standard); }
    .change:hover::after { transform: scaleX(1); }
    .toggle-input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .toggle { position: relative; display: inline-block; width: 42px; height: 24px; border-radius: 14px; background: #35414D; transition: background-color var(--dur-short) var(--ease-standard); }
    .toggle::after { position: absolute; top: 4px; left: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); content: ""; transition: transform var(--dur-short) var(--ease-pop), background-color var(--dur-short) var(--ease-standard); }
    .toggle-input:checked + .toggle { background: var(--lime); }
    .toggle-input:checked + .toggle::after { background: #0B1007; transform: translateX(18px); }
    .toggle-label { color: var(--muted); font-size: var(--size-meta); }
    .start { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 50px; margin-top: 28px; border-radius: 10px; background: var(--lime); color: #0B1007; font-weight: 800; transition: background-color var(--dur-micro) var(--ease-standard), transform var(--dur-micro) var(--ease-standard), box-shadow var(--dur-micro) var(--ease-standard); animation: fade-rise var(--dur-med) var(--ease-decel) var(--delay-5) both; }
    .start:hover { background: #D8FF85; box-shadow: 0 0 28px rgba(198,255,74,.20); transform: translateY(-2px); }
    @keyframes fade-rise { from { opacity: 0; filter: blur(8px); transform: translateY(10px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
    @keyframes focus-in { from { outline-color: transparent; } to { outline-color: var(--lime); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="scene"><section class="card" aria-labelledby="first-run-title"><a class="brand" href="01-home.html" aria-label="FIXED">FI<span class="x">X</span>ED</a><h1 id="first-run-title">Three defaults. Zero setup.</h1><div class="settings"><div class="setting"><span class="setting-name">Library</span><div class="setting-tools"><span class="detected">detected: Linux</span><button class="change" type="button">change</button></div></div><label class="setting"><span class="setting-name">Add to Steam</span><span class="toggle-wrap"><span class="toggle-label">On</span><input class="toggle-input" type="checkbox" checked><span class="toggle" aria-hidden="true"></span></span></label><label class="setting"><span class="setting-name">Parallel downloads</span><span class="toggle-wrap"><span class="toggle-label">On</span><input class="toggle-input" type="checkbox" checked><span class="toggle" aria-hidden="true"></span></span></label></div><a class="start" href="01-home.html">Start browsing</a></section></main>
</body>
</html>
