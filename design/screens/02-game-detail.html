<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=800, initial-scale=1">
  <title>FIXED — Ready or Not</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #090C10;
      --rail: #10151B;
      --surface: #121820;
      --elevated: #19212B;
      --line: rgba(213,225,237,.12);
      --text: #F2F5F7;
      --muted: #9AA6B5;
      --lime: #C6FF4A;
      --size-display: 42px;
      --size-body: 14px;
      --size-meta: 11px;
      --dur-micro: 100ms;
      --dur-short: 200ms;
      --dur-med: 300ms;
      --dur-long: 500ms;
      --ease-standard: cubic-bezier(.2,0,0,1);
      --ease-decel: cubic-bezier(.05,.7,.1,1);
      --ease-accel: cubic-bezier(.3,0,.8,.15);
      --ease-pop: cubic-bezier(.2,1.6,.4,1);
      --delay-1: 0ms;
      --delay-2: 50ms;
      --delay-3: 100ms;
      --delay-4: 150ms;
    }
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 800px; margin: 0; background: var(--bg); color: var(--text); }
    body { overflow: hidden; font-size: var(--size-body); }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    :focus { outline: 0; }
    :focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; animation: focus-in var(--dur-micro) var(--ease-standard) both; }
    .shell { display: grid; grid-template-columns: 88px 1fr; width: 100%; height: 100%; }
    .rail { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; padding: 24px 14px 20px; border-right: 1px solid var(--line); background: var(--rail); }
    .brand { color: var(--text); font-size: var(--size-body); font-weight: 850; letter-spacing: .22em; line-height: 1; }
    .brand .x { color: var(--lime); }
    .rail-nav { display: grid; gap: 9px; margin-top: 42px; }
    .nav-item { position: relative; display: grid; width: 58px; height: 48px; place-items: center; border-radius: 10px; color: var(--muted); transition: color var(--dur-micro) var(--ease-standard), background-color var(--dur-micro) var(--ease-standard), transform var(--dur-micro) var(--ease-standard); }
    .nav-item:hover, .nav-item.active { color: var(--text); background: var(--elevated); }
    .nav-item:hover { transform: translateY(-2px); }
    .nav-item::before { position: absolute; left: -14px; width: 3px; height: 30px; border-radius: 0 3px 3px 0; background: var(--lime); content: ""; opacity: 0; transition: opacity var(--dur-micro) var(--ease-standard), transform var(--dur-micro) var(--ease-pop); transform: scaleY(.25); }
    .nav-item.active::before { opacity: 1; transform: scaleY(1); }
    .nav-item svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .rail-foot { margin-top: auto; color: var(--muted); }
    .main { position: relative; min-width: 0; padding: 24px 24px 18px; overflow: hidden; }
    .backdrop { position: absolute; z-index: 0; inset: 0; background: linear-gradient(90deg, var(--bg) 0%, rgba(9,12,16,.92) 43%, rgba(9,12,16,.36) 100%), linear-gradient(0deg, rgba(9,12,16,.72), transparent 52%), url("../assets/hero_1144200.jpg") center / cover no-repeat; filter: saturate(.62) brightness(.65); opacity: .68; }
    .back { position: absolute; z-index: 3; top: 26px; right: 26px; display: inline-flex; align-items: center; gap: 11px; color: var(--muted); transition: color var(--dur-micro) var(--ease-standard), transform var(--dur-micro) var(--ease-standard); }
    .back:hover { color: var(--text); transform: translateX(-3px); }
    .back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .detail { position: relative; z-index: 1; display: grid; grid-template-columns: 410px minmax(0, 500px); gap: 44px; width: 100%; height: 100%; align-items: center; padding: 28px 0 0 12px; }
    .poster-column { align-self: center; animation: fade-rise var(--dur-med) var(--ease-decel) var(--delay-1) both; }
    .poster { width: 384px; height: 512px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: 0 22px 60px rgba(0,0,0,.34); }
    .poster img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 34%; }
    .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; width: 384px; margin-top: 10px; }
    .shot { height: 76px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--elevated); }
    .shot img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(var(--shot-scale)); object-position: var(--shot-position); transition: transform var(--dur-micro) var(--ease-standard), filter var(--dur-micro) var(--ease-standard); }
    .shot:hover img { filter: saturate(1.12); transform: scale(calc(var(--shot-scale) + .05)); }
    .copy { width: 500px; padding-top: 16px; animation: fade-rise var(--dur-med) var(--ease-decel) var(--delay-2) both; }
    .game-logo { display: block; width: 390px; height: 96px; object-fit: contain; object-position: left center; margin-left: -12px; }
    .genre { margin-top: 4px; color: var(--muted); font-size: var(--size-body); }
    .description { margin-top: 24px; color: #D7DEE7; }
    .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
    .meta-tile { display: grid; gap: 6px; min-height: 72px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 11px; background: rgba(18,24,32,.74); }
    .meta-tile span { color: var(--muted); font-size: var(--size-meta); }
    .meta-tile strong { font-size: var(--size-body); font-weight: 750; }
    .trust { margin-top: 14px; color: var(--muted); font-size: var(--size-meta); }
    .trust::before { display: inline-block; width: 6px; height: 6px; margin: 0 8px 1px 0; border-radius: 50%; background: var(--lime); content: ""; }
    .download { width: 100%; height: 52px; margin-top: 16px; }
    .download svg { width: 21px; height: 21px; }
    .steam-toggle { display: inline-flex; align-items: center; gap: 10px; margin: 11px 0 0 2px; color: var(--muted); font-size: var(--size-meta); cursor: pointer; }
    .steam-toggle input, .torrent-reveal input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .toggle { position: relative; display: inline-block; width: 40px; height: 22px; border-radius: 13px; background: #394451; transition: background-color var(--dur-short) var(--ease-standard); }
    .toggle::after { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); content: ""; transition: transform var(--dur-short) var(--ease-pop), background-color var(--dur-short) var(--ease-standard); }
    .steam-toggle input:checked + .toggle { background: var(--lime); }
    .steam-toggle input:checked + .toggle::after { background: #0B1007; transform: translateX(18px); }
    .sources { margin-top: 14px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: rgba(18,24,32,.82); }
    .sources-head { padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 750; }
    .source-row { display: grid; grid-template-columns: 24px 1fr auto 14px; gap: 10px; align-items: center; min-height: 39px; padding: 0 16px; border-bottom: 1px solid rgba(213,225,237,.08); color: var(--muted); }
    .source-row:last-of-type { border-bottom: 0; }
    .source-row svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .source-name { color: var(--text); }
    .status { display: inline-flex; align-items: center; gap: 7px; font-size: var(--size-meta); }
    .status::before { width: 7px; height: 7px; border-radius: 50%; background: #8996A6; content: ""; }
    .status.recommended::before { background: var(--lime); }
    .row-arrow { width: 14px; height: 14px; }
    .torrent-reveal { position: relative; display: block; padding: 10px 16px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--size-meta); cursor: pointer; transition: color var(--dur-micro) var(--ease-standard); }
    .torrent-reveal:hover { color: var(--text); }
    .torrent-action { text-decoration: underline; text-decoration-color: var(--lime); text-underline-offset: 3px; }
    .warning { display: block; max-height: 0; margin-top: 0; overflow: hidden; color: var(--lime); opacity: 0; transition: max-height var(--dur-short) var(--ease-standard), margin-top var(--dur-short) var(--ease-standard), opacity var(--dur-short) var(--ease-standard); }
    .torrent-reveal:hover .warning, .torrent-reveal:has(input:checked) .warning { max-height: 30px; margin-top: 7px; opacity: 1; }
    @keyframes fade-rise { from { opacity: 0; filter: blur(8px); transform: translateY(10px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
    @keyframes focus-in { from { outline-color: transparent; } to { outline-color: var(--lime); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
