[package]
name = "fix-core"
version = "0.2.1"
edition = "2021"

[dependencies]
scraper = "0.20"
encoding_rs = "0.8"
ureq = "2"
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librqbit = "8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
bytes = "1"

[dev-dependencies]
tempfile = "3"
